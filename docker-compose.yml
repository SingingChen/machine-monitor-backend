version: '3.8'

services:
  # 1. PostgreSQL 資料庫
  db:
    image: postgres:15
    container_name: machine_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: machine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. NestJS 後端服務
  api:
    build: .
    container_name: machine_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      # 注意：這裡的 db 是 service 名稱，Docker 會自動解析 IP
      DATABASE_URL: "postgresql://user:password@db:5432/machine_db?schema=public"
      GOOGLE_APPLICATION_CREDENTIALS: "/app/gcp-key.json"
    depends_on:
      - db
    volumes:
      - ./your-local-gcp-key.json:/app/gcp-key.json # 掛載 GCP 金鑰

volumes:
  postgres_data: