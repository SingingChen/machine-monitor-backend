version: '3.8'

services:
  # 1. PostgreSQL 資料庫
  db:
    image: postgres:15
    container_name: machine_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: machine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. NestJS 後端服務
  api:
    build: .
    container_name: machine_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      # 注意：這裡的 db 是 service 名稱，Docker 會自動解析 IP
      DATABASE_URL: "postgresql://user:password@db:5432/machine_db?schema=public"
      # 如果你現在還沒放金鑰，先註解掉下面這行，避免啟動失敗
      # GOOGLE_APPLICATION_CREDENTIALS: "/usr/src/app/gcp-key.json"
      # 告訴程式碼 Pub/Sub 模擬器在哪裡
      PUBSUB_EMULATOR_HOST: "pubsub:8085"
      GCP_PROJECT_ID: "local-project"
    depends_on:
      - db
      - pubsub

    volumes:
      - .:/usr/src/app            # <--- 加入這行，程式碼才會同步
      - /usr/src/app/node_modules # <--- 加入這行，避免套件衝突
      # 下面這行先註解掉，等你有金鑰檔案時再開啟
     # - ./gcp-key.json:/usr/src/app/gcp-key.json
  # 新增：GCP Pub/Sub 模擬器
  pubsub:
    container_name: machine_pubsub
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

volumes:
  postgres_data: