name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - gcpPubSub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Build and Push Container'
        run: |
          # 這裡改用 Artifact Registry 的標準格式：
          # [區域]-docker.pkg.dev/[專案ID]/[儲存庫名稱]/[映像檔名稱]:[標籤]
          gcloud builds submit \
            --tag asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/machine-api/backend-service:latest \
            .

      - name: 'Deploy to Cloud Run'
        run: |
          # 這裡使用 ^|^ 處理含有逗號的 CORS 網址
          gcloud run deploy machine-api \
            --image asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/machine-api/backend-service:latest \
            --platform managed \
            --region asia-east1 \
            --allow-unauthenticated \
            --session-affinity \
            --memory 1Gi \
            --set-env-vars "^|^DATABASE_URL=${{ secrets.DATABASE_URL }}|CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}"