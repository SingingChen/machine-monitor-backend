name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - gcpPubSub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Build and Push Container'
        run: |
          # 方案 B 下，上下文直接是當前目錄 (.)
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/machine-api .

      - name: 'Deploy to Cloud Run'
        run: |
          gcloud run deploy machine-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/machine-api \
            --platform managed \
            --region asia-east1 \
            --allow-unauthenticated \
            --session-affinity \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}",CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}"